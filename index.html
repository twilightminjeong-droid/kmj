<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골프존 닉네임 생성기 MAX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #0f1215; /* 삼성헬스 느낌의 딥 다크 모드 배경 */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #181c22, #12151a);
            border: 1px solid rgba(0, 210, 150, 0.2); /* 삼성헬스 시그니처 민트 포인트 테두리 */
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
        }
        h1 { 
            color: #00d296; /* 삼성헬스 시그니처 민트 컬러 */
            font-size: 24px; 
            margin-bottom: 8px; 
            letter-spacing: -0.5px;
        }
        p.subtitle { color: #8c98a4; font-size: 14px; margin-bottom: 25px; }
        
        /* 무한 생성 토글 스위치 박스 */
        .infinite-toggle-box {
            background-color: #12151a;
            border: 1px solid #242c38;
            border-radius: 14px;
            padding: 12px 18px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .infinite-label {
            font-size: 13px;
            color: #00d296;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 삼성헬스 스타일 토글 스위치 커스텀 디자인 */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #242c38;
            transition: .3s;
            border-radius: 26px;
            border: 1px solid #323d4e;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 2px; bottom: 2px;
            background-color: #ffffff;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #00d296; border-color: #00d296; }
        input:checked + .slider:before { transform: translateX(22px); }

        .mode-group {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        
        .btn-mode {
            background-color: #1a2028; 
            color: #b0bac5;
            border: 1px solid #2a3442; 
            padding: 12px 8px;
            border-radius: 14px; 
            font-size: 13px;
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s ease;
        }
        .btn-mode:hover {
            background-color: #242c38; 
            color: #ffffff; 
            border-color: #00d296;
        }
        /* 활성화 상태: 삼성헬스 스타일 민트 테두리 & 배경 포인트 */
        .btn-mode.active {
            background: linear-gradient(135deg, rgba(0, 210, 150, 0.15), rgba(0, 210, 150, 0.05));
            color: #00d296; 
            border-color: #00d296;
            box-shadow: 0 0 12px rgba(0, 210, 150, 0.2);
        }

        .btn-mode.random-btn {
            grid-column: span 3;
            background-color: #202834;
            font-size: 15px;
            padding: 14px;
            color: #ffffff;
            border: 1px solid #323d4e;
        }
        .btn-mode.random-btn:hover, .btn-mode.random-btn.active {
            background: linear-gradient(135deg, #00d296, #00a876);
            color: #0f1215;
            border-color: #00d296;
            font-weight: bold;
        }

        .btn-generate {
            background: linear-gradient(135deg, #00d296, #00996c); 
            color: #0f1215;
            border: none; width: 100%; padding: 16px;
            font-size: 17px; font-weight: bold; border-radius: 16px;
            cursor: pointer; box-shadow: 0 6px 20px rgba(0, 210, 150, 0.35);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-generate:active { transform: scale(0.98); }
        .btn-generate:hover { opacity: 0.92; }
        
        .result-box {
            background-color: #12151a; 
            border: 1px solid #242c38;
            border-radius: 16px; padding: 25px 15px; margin-top: 22px;
        }
        
        #nicknameDisplay { 
            font-size: 26px; font-weight: bold; min-height: 40px; color: #ffffff; 
            letter-spacing: 1.5px;
        }

        @keyframes slotSpin {
            0% { opacity: 0.4; transform: scale(0.95); filter: blur(1px); }
            50% { opacity: 1; transform: scale(1.02); filter: blur(0px); }
            100% { opacity: 0.4; transform: scale(0.95); filter: blur(1px); }
        }
        .slot-anim {
            animation: slotSpin 0.08s infinite alternate;
            color: #00d296 !important;
        }

        .btn-copy {
            margin-top: 15px; background-color: transparent; color: #00d296;
            border: 1px solid #00d296; padding: 8px 18px; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.2s;
        }
        .btn-copy:hover { background-color: rgba(0, 210, 150, 0.1); }

        .footer-credit {
            margin-top: 22px;
            font-size: 12px;
            color: #586370;
            letter-spacing: 1px;
            border-top: 1px solid #1a2028;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛳ GOLFZON NICKNAME</h1>
        <p class="subtitle">5자 이내, 띄어쓰기 없는 유니크한 닉네임!</p>

        <!-- 무한 생성 모드 토글 바 -->
        <div class="infinite-toggle-box">
            <span class="infinite-label">🔄 무한 슬롯머신 모드</span>
            <label class="switch">
                <input type="checkbox" id="infiniteToggle" onchange="toggleInfiniteMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mode-group">
            <button class="btn-mode" onclick="selectMode('pro', this)">😎 세련/프로</button>
            <button class="btn-mode active" onclick="selectMode('humor', this)">🤣 유머</button>
            <button class="btn-mode" onclick="selectMode('skilled', this)">🏆 실력자</button>
            <button class="btn-mode" onclick="selectMode('short', this)">⚡ 짧고강한</button>
            <button class="btn-mode" onclick="selectMode('luck', this)">🍀 행운</button>
            <button class="btn-mode" onclick="selectMode('dialect', this)">🗣️ 사투리</button>
            <button class="btn-mode random-btn" onclick="selectMode('all', this)">🎲 랜덤 생성</button>
        </div>

        <button class="btn-generate" id="actionBtn" onclick="handleGenerateClick()">닉네임 샷! 🏌️‍♂️</button>

        <div class="result-box">
            <div id="nicknameDisplay">버튼을눌러요</div>
            <button class="btn-copy" onclick="copyToClipboard()">📋 복사</button>
        </div>

        <div class="footer-credit">
            Created by <b>mj studio</b>
        </div>
    </div>

    <script>
        let currentMode = 'humor';
        let isInfiniteRunning = false;
        let infiniteTimer = null;
        
        // 최근 생성된 닉네임 30회 중복 방지 메모리 배열
        let recentNicknames = [];
        const MAX_HISTORY_SIZE = 30;

        // 흔한 닉네임을 대폭 배제하고 유니크하고 세련된 단어들로 구성된 데이터베이스 (5자 이내, 띄어쓰기 없음)
        const nicknameDB = {
            pro: ['템포유령', '클럽피팅', '에임테크', '탄도조절', '백스핀러', '클러치샷', '스윙아키', '레이저온', '볼스트릭'],
            humor: ['잔디삭막', '파지팡이', '해저드너', ' OB단골', '양파수집', '그린무법', '볼도둑놈', '뒤땅마왕', '허공스윙'],
            skilled: ['이글헌터', '언더파러', '니어지존', '홀인원러', '핀포인트', '퍼트도사', '버디기계', '샷테크닉', '드라이버'],
            short: ['제우스', '포세이', '아이언', '타이탄', '스톰프', '매버릭', '스파크', '소닉샷', '볼텍스', '제니스'],
            luck: ['트리플', '세븐팟', '클로버', '골드러', '럭키온', '알바트로', '기적샷', '대박찬스', '행운팟'],
            dialect: [
                '단디쳐라', '마파람', '쪼아쓰', '우째스노',
                '거시기', '아따참', '워매소름', '허벌나',
                '혼저옵', '한라샷', '도르라', '기막히',
                '참거기', '나이스유', '천천히', '냅둬유',
                '마카다', '강릉풍', '드래요'
            ]
        };

        function selectMode(mode, element) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            if (isInfiniteRunning) {
                stopInfinite();
                startInfinite();
            }
        }

        // 30회 중복 방지 스마트 랜덤 추출 함수
        function getUniqueRandomItem(arr) {
            let candidate = '';
            let attempts = 0;
            
            do {
                candidate = arr[Math.floor(Math.random() * arr.length)];
                attempts++;
                if (attempts > 50) break; 
            } while (recentNicknames.includes(candidate));

            recentNicknames.push(candidate);
            
            if (recentNicknames.length > MAX_HISTORY_SIZE) {
                recentNicknames.shift();
            }

            return candidate;
        }

        function toggleInfiniteMode() {
            const toggle = document.getElementById('infiniteToggle');
            const actionBtn = document.getElementById('actionBtn');
            
            if (toggle.checked) {
                actionBtn.innerText = "정지 (STOP) ⏹️";
                actionBtn.style.background = "linear-gradient(135deg, #ff5252, #d32f2f)";
                actionBtn.style.boxShadow = "0 6px 20px rgba(255, 82, 82, 0.35)";
                startInfinite();
            } else {
                actionBtn.innerText = "닉네임 샷! 🏌️‍♂️";
                actionBtn.style.background = "linear-gradient(135deg, #00d296, #00996c)";
                actionBtn.style.boxShadow = "0 6px 20px rgba(0, 210, 150, 0.35)";
                stopInfinite();
            }
        }

        function handleGenerateClick() {
            const toggle = document.getElementById('infiniteToggle');
            if (toggle.checked) {
                toggle.checked = false;
                toggleInfiniteMode();
            } else {
                generateSingleNickname();
            }
        }

        function generateSingleNickname() {
            let activeMode = currentMode === 'all' 
                ? getUniqueRandomItem(['pro', 'humor', 'skilled', 'short', 'luck', 'dialect']) 
                : currentMode;
                
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.remove('slot-anim');
            
            const resultArray = nicknameDB[activeMode];
            displayEl.innerText = getUniqueRandomItem(resultArray);
        }

        function startInfinite() {
            isInfiniteRunning = true;
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.add('slot-anim');
            
            infiniteTimer = setInterval(() => {
                let currentActiveMode = currentMode === 'all' 
                    ? getUniqueRandomItem(['pro', 'humor', 'skilled', 'short', 'luck', 'dialect']) 
                    : currentMode;
                const activeArray = nicknameDB[currentActiveMode];
                displayEl.innerText = getUniqueRandomItem(activeArray);
            }, 70);
        }

        function stopInfinite() {
            isInfiniteRunning = false;
            clearInterval(infiniteTimer);
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.remove('slot-anim');
            generateSingleNickname();
        }

        function copyToClipboard() {
            const text = document.getElementById('nicknameDisplay').innerText;
            if (text === '버튼을눌러요') return alert('먼저 닉네임을 생성해 주세요!');
            document.execCommand('copy');
            alert(`'${text}' 복사 완료!`);
        }
    </script>
</body>
</html>
