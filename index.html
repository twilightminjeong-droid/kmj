<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골프존 닉네임 생성기 MAX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #121813;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #1e2620, #161d18);
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 8px; }
        p.subtitle { color: #a0aab0; font-size: 14px; margin-bottom: 25px; }
        
        .mode-group {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        
        .btn-mode {
            background-color: #2a342c; color: #e0e0e0;
            border: 1px solid #3d4a3f; padding: 10px;
            border-radius: 10px; font-size: 13px;
            font-weight: bold; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-mode.active, .btn-mode:hover {
            background-color: #d4af37; color: #121813; border-color: #d4af37;
        }

        .btn-mode.random-btn {
            grid-column: span 3;
            background-color: #3d4a3f;
            font-size: 15px;
            padding: 12px;
        }
        .btn-mode.random-btn:hover {
            background-color: #d4af37;
        }

        .btn-generate {
            background: linear-gradient(135deg, #2e7d32, #1b5e20); color: #ffffff;
            border: none; width: 100%; padding: 16px;
            font-size: 18px; font-weight: bold; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
            transition: transform 0.1s;
        }
        .btn-generate:active { transform: scale(0.98); }
        
        .result-box {
            background-color: #0b0f0c; border: 1px dashed #d4af37;
            border-radius: 12px; padding: 25px 15px; margin-top: 25px;
        }
        
        #nicknameDisplay { 
            font-size: 28px; font-weight: bold; min-height: 40px; color: #ffffff; 
            letter-spacing: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-anim {
            animation: fadeIn 0.3s ease-out forwards;
        }

        .btn-copy {
            margin-top: 15px; background-color: transparent; color: #d4af37;
            border: 1px solid #d4af37; padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;
        }
        .btn-copy:hover { background-color: #d4af37; color: #121813; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛳ GOLFZON NICKNAME</h1>
        <p class="subtitle">5자 이내, 띄어쓰기 없는 완벽한 닉네임!</p>

        <div class="mode-group">
            <button class="btn-mode" onclick="selectMode('pro', this)">😎 세련/프로</button>
            <button class="btn-mode active" onclick="selectMode('humor', this)">🤣 유머</button>
            <button class="btn-mode" onclick="selectMode('skilled', this)">🏆 실력자</button>
            <button class="btn-mode" onclick="selectMode('short', this)">⚡ 짧고강한</button>
            <button class="btn-mode" onclick="selectMode('luck', this)">🍀 행운</button>
            <button class="btn-mode" onclick="selectMode('dialect', this)">🗣️ 사투리</button>
            <button class="btn-mode random-btn" onclick="selectMode('all', this)">🎲 랜덤 생성</button>
        </div>

        <button class="btn-generate" onclick="generateNickname()">닉네임 샷! 🏌️‍♂️</button>

        <div class="result-box">
            <div id="nicknameDisplay">버튼을눌러요</div>
            <button class="btn-copy" onclick="copyToClipboard()">📋 복사</button>
        </div>
    </div>

    <script>
        let currentMode = 'humor';
        
        const nicknameDB = {
            pro: ['로리맥킬로', '타이거우즈', '존람스윙', '박세리키즈', '스피스퍼트', '켑카파워', '셰플러샷', '디섐보드론', '모리카와'],
            humor: ['양파요정', '잔디파괴자', '벙커귀신', '오비탈출', '명랑골퍼', '뒤땅장인', '해저드수집', '카트라이더', '골프환자'],
            skilled: ['버디머신', '이글킬러', '싱글메이커', '언더파', '홀인원맨', '퍼팅마스터', '정교한아이', '아이언맨', '백스핀신'],
            short: ['독사', '원빳', '투온', '장타', '불도저', '탱크', '송곳', '레이저', '직진', '원샷'],
            luck: ['럭키골퍼', '네잎클로버', '행운의샷', '럭키세븐', '대박샷', '기적의퍼트', '오운완', '행운만땅'],
            dialect: [
                '단디치라', '마풀스윙', '쫌드루와', '우짜꼬',
                '거시기샷', '아따나샷', '워매버디', '허벌타구',
                '혼저옵서', '한라산버디', '도르라샷', '무사경',
                '괜찮아유', '나이스유', '천천히혀', '냅둬유',
                '마카모여', '강릉독수리', '드래요샷'
            ]
        };

        function selectMode(mode, element) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function generateNickname() {
            let activeMode = currentMode === 'all' 
                ? getRandomItem(['pro', 'humor', 'skilled', 'short', 'luck', 'dialect']) 
                : currentMode;
                
            const displayEl = document.getElementById('nicknameDisplay');
            
            displayEl.classList.remove('fade-in-anim');
            void displayEl.offsetWidth; 
            
            const resultArray = nicknameDB[activeMode];
            displayEl.innerText = getRandomItem(resultArray);
            
            displayEl.classList.add('fade-in-anim');
        }

        function copyToClipboard() {
            const text = document.getElementById('nicknameDisplay').innerText;
            if (text === '버튼을눌러요') return alert('먼저 닉네임을 생성해 주세요!');
            navigator.clipboard.writeText(text).then(() => alert(`'${text}' 복사 완료!`));
        }
    </script>
</body>
</html>
