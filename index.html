<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골프존 닉네임 무한생성기 MAX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #121813;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #1e2620, #161d18);
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        h1 { color: #d4af37; font-size: 24px; margin-bottom: 8px; }
        p.subtitle { color: #a0aab0; font-size: 14px; margin-bottom: 20px; }
        
        /* 무한 생성 토글 스위치 박스 */
        .infinite-toggle-box {
            background-color: #161d18;
            border: 1px solid #2e4033;
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .infinite-label {
            font-size: 13px;
            color: #d4af37;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* 스위치 커스텀 디자인 */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2a342c;
            transition: .3s;
            border-radius: 24px;
            border: 1px solid #3d4a3f;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px;
            left: 2px; bottom: 2px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #2e7d32; }
        input:checked + .slider:before { transform: translateX(22px); }

        .mode-group {
            display: grid; 
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 20px;
        }
        
        .btn-mode {
            background-color: #2a342c; color: #e0e0e0;
            border: 1px solid #3d4a3f; padding: 10px;
            border-radius: 10px; font-size: 13px;
            font-weight: bold; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-mode.active, .btn-mode:hover {
            background-color: #d4af37; color: #121813; border-color: #d4af37;
        }

        .btn-mode.random-btn {
            grid-column: span 3;
            background-color: #3d4a3f;
            font-size: 15px;
            padding: 12px;
        }
        .btn-mode.random-btn:hover {
            background-color: #d4af37;
        }

        .btn-generate {
            background: linear-gradient(135deg, #2e7d32, #1b5e20); color: #ffffff;
            border: none; width: 100%; padding: 16px;
            font-size: 18px; font-weight: bold; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
            transition: transform 0.1s;
        }
        .btn-generate:active { transform: scale(0.98); }
        
        .result-box {
            background-color: #0b0f0c; border: 1px dashed #d4af37;
            border-radius: 12px; padding: 25px 15px; margin-top: 25px;
        }
        
        #nicknameDisplay { 
            font-size: 28px; font-weight: bold; min-height: 40px; color: #ffffff; 
            letter-spacing: 2px;
        }

        @keyframes slotSpin {
            0% { opacity: 0.4; transform: scale(0.95); filter: blur(1px); }
            50% { opacity: 1; transform: scale(1.02); filter: blur(0px); }
            100% { opacity: 0.4; transform: scale(0.95); filter: blur(1px); }
        }
        .slot-anim {
            animation: slotSpin 0.08s infinite alternate;
            color: #ffd700 !important;
        }

        .btn-copy {
            margin-top: 15px; background-color: transparent; color: #d4af37;
            border: 1px solid #d4af37; padding: 8px 16px; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.2s;
        }
        .btn-copy:hover { background-color: #d4af37; color: #121813; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛳ GOLFZON NICKNAME</h1>
        <p class="subtitle">5자 이내, 띄어쓰기 없는 완벽한 닉네임!</p>

        <!-- 무한 생성 모드 토글 바 -->
        <div class="infinite-toggle-box">
            <span class="infinite-label">🔄 무한 슬롯머신 모드</span>
            <label class="switch">
                <input type="checkbox" id="infiniteToggle" onchange="toggleInfiniteMode()">
                <span class="slider"></span>
            </label>
        </div>

        <div class="mode-group">
            <button class="btn-mode" onclick="selectMode('pro', this)">😎 세련/프로</button>
            <button class="btn-mode active" onclick="selectMode('humor', this)">🤣 유머</button>
            <button class="btn-mode" onclick="selectMode('skilled', this)">🏆 실력자</button>
            <button class="btn-mode" onclick="selectMode('short', this)">⚡ 짧고강한</button>
            <button class="btn-mode" onclick="selectMode('luck', this)">🍀 행운</button>
            <button class="btn-mode" onclick="selectMode('dialect', this)">🗣️ 사투리</button>
            <button class="btn-mode random-btn" onclick="selectMode('all', this)">🎲 랜덤 생성</button>
        </div>

        <button class="btn-generate" id="actionBtn" onclick="handleGenerateClick()">닉네임 샷! 🏌️‍♂️</button>

        <div class="result-box">
            <div id="nicknameDisplay">버튼을눌러요</div>
            <button class="btn-copy" onclick="copyToClipboard()">📋 복사</button>
        </div>
    </div>

    <script>
        let currentMode = 'humor';
        let isInfiniteRunning = false;
        let infiniteTimer = null;
        
        // 최근에 생성된 닉네임을 기록하는 메모리 배열 (중복 방지용)
        let recentNicknames = [];
        const MAX_HISTORY_SIZE = 30; // 최소 30번 동안 같은 닉네임 반복 금지

        const nicknameDB = {
            pro: ['로리맥킬로', '타이거우즈', '존람스윙', '박세리키즈', '스피스퍼트', '켑카파워', '셰플러샷', '디섐보드론', '모리카와'],
            humor: ['양파요정', '잔디파괴자', '벙커귀신', '오비탈출', '명랑골퍼', '뒤땅장인', '해저드수집', '카트라이더', '골프환자'],
            skilled: ['버디머신', '이글킬러', '싱글메이커', '언더파', '홀인원맨', '퍼팅마스터', '정교한아이', '아이언맨', '백스핀신'],
            short: ['독사', '원빳', '투온', '장타', '불도저', '탱크', '송곳', '레이저', '직진', '원샷'],
            luck: ['럭키골퍼', '네잎클로버', '행운의샷', '럭키세븐', '대박샷', '기적의퍼트', '오운완', '행운만땅'],
            dialect: [
                '단디치라', '마풀스윙', '쫌드루와', '우짜꼬',
                '거시기샷', '아따나샷', '워매버디', '허벌타구',
                '혼저옵서', '한라산버디', '도르라샷', '무사경',
                '괜찮아유', '나이스유', '천천히혀', '냅둬유',
                '마카모여', '강릉독수리', '드래요샷'
            ]
        };

        function selectMode(mode, element) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            if (isInfiniteRunning) {
                stopInfinite();
                startInfinite();
            }
        }

        // 중복 방지 로직이 포함된 스마트 랜덤 추출 함수
        function getUniqueRandomItem(arr) {
            let candidate = '';
            let attempts = 0;
            
            // 무한 루프 방지를 위해 최대 시도 횟수를 제한하고 후보를 찾습니다.
            do {
                candidate = arr[Math.floor(Math.random() * arr.length)];
                attempts++;
                // 만약 전체 아이템 개수가 30개보다 적다면 중복 제한을 배열 크기만큼으로 자동 조절합니다.
                if (attempts > 50) break; 
            } while (recentNicknames.includes(candidate));

            // 최근 기록 장소에 추가
            recentNicknames.push(candidate);
            
            // 기록이 30개를 넘어가면 가장 오래된 항목을 삭제하여 메모리 관리
            if (recentNicknames.length > MAX_HISTORY_SIZE) {
                recentNicknames.shift();
            }

            return candidate;
        }

        function toggleInfiniteMode() {
            const toggle = document.getElementById('infiniteToggle');
            const actionBtn = document.getElementById('actionBtn');
            
            if (toggle.checked) {
                actionBtn.innerText = "정지 (STOP) ⏹️";
                actionBtn.style.background = "linear-gradient(135deg, #c62828, #b71c1c)";
                startInfinite();
            } else {
                actionBtn.innerText = "닉네임 샷! 🏌️‍♂️";
                actionBtn.style.background = "linear-gradient(135deg, #2e7d32, #1b5e20)";
                stopInfinite();
            }
        }

        function handleGenerateClick() {
            const toggle = document.getElementById('infiniteToggle');
            if (toggle.checked) {
                toggle.checked = false;
                toggleInfiniteMode();
            } else {
                generateSingleNickname();
            }
        }

        function generateSingleNickname() {
            let activeMode = currentMode === 'all' 
                ? getUniqueRandomItem(['pro', 'humor', 'skilled', 'short', 'luck', 'dialect']) 
                : currentMode;
                
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.remove('slot-anim');
            
            const resultArray = nicknameDB[activeMode];
            displayEl.innerText = getUniqueRandomItem(resultArray);
        }

        function startInfinite() {
            isInfiniteRunning = true;
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.add('slot-anim');
            
            infiniteTimer = setInterval(() => {
                let currentActiveMode = currentMode === 'all' 
                    ? getUniqueRandomItem(['pro', 'humor', 'skilled', 'short', 'luck', 'dialect']) 
                    : currentMode;
                const activeArray = nicknameDB[currentActiveMode];
                displayEl.innerText = getUniqueRandomItem(activeArray);
            }, 70);
        }

        function stopInfinite() {
            isInfiniteRunning = false;
            clearInterval(infiniteTimer);
            const displayEl = document.getElementById('nicknameDisplay');
            displayEl.classList.remove('slot-anim');
            generateSingleNickname();
        }

        function copyToClipboard() {
            const text = document.getElementById('nicknameDisplay').innerText;
            if (text === '버튼을눌러요') return alert('먼저 닉네임을 생성해 주세요!');
            navigator.clipboard.writeText(text).then(() => alert(`'${text}' 복사 완료!`));
        }
    </script>
</body>
</html>
